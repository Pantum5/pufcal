<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Վաճառքի հաշվարկ</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        color: #222;
    }

    .container {
        max-width: 700px;
        margin: 30px auto;
        padding: 20px;
    }

    h1 {
        text-align: center;
        margin-bottom: 20px;
    }

    textarea {
        width: 100%;
        min-height: 220px;
        padding: 15px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 10px;
        resize: vertical;
    }

    button {
        border: none;
        border-radius: 8px;
        padding: 11px 16px;
        font-size: 15px;
        cursor: pointer;
    }

    .main-buttons {
        display: flex;
        gap: 10px;
        margin-top: 12px;
    }

    .calculate-btn {
        flex: 1;
        background: #111;
        color: white;
    }

    .products-btn {
        background: #ddd;
    }

    .result {
        margin-top: 20px;
    }

    .sale-item {
        background: white;
        border-radius: 10px;
        padding: 14px;
        margin-bottom: 10px;
        box-shadow: 0 2px 7px rgba(0,0,0,0.06);
    }

    .sale-item strong {
        display: block;
        margin-bottom: 7px;
    }

    .totals {
        background: #111;
        color: white;
        border-radius: 10px;
        padding: 18px;
        margin-top: 15px;
        line-height: 1.8;
    }

    .error {
        background: #ffe5e5;
        color: #b00000;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 10px;
    }

    /* Modal */

    .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.55);
        z-index: 1000;
        padding: 20px;
        overflow-y: auto;
    }

    .modal-content {
        max-width: 650px;
        margin: 30px auto;
        background: white;
        border-radius: 14px;
        padding: 20px;
    }

    .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }

    .modal-header h2 {
        margin: 0;
    }

    .close-btn {
        background: #eee;
        font-size: 20px;
        padding: 6px 12px;
    }

    .form-group {
        margin-bottom: 12px;
    }

    .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
    }

    .form-group input {
        width: 100%;
        padding: 11px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 15px;
    }

    .save-product-btn {
        width: 100%;
        background: #111;
        color: white;
    }

    .cancel-edit-btn {
        width: 100%;
        margin-top: 8px;
        background: #ddd;
        display: none;
    }

    .product-list {
        margin-top: 25px;
    }

    .product-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        background: #f7f7f7;
        padding: 12px;
        border-radius: 9px;
        margin-bottom: 8px;
    }

    .product-info {
        flex: 1;
    }

    .product-name {
        font-weight: bold;
    }

    .product-cost {
        color: #555;
        margin-top: 3px;
    }

    .product-actions {
        display: flex;
        gap: 6px;
    }

    .edit-btn {
        background: #ddd;
    }

    .delete-btn {
        background: #ffd8d8;
        color: #a00000;
    }

    .loading {
        text-align: center;
        padding: 15px;
        color: #666;
    }
</style>
</head>

<body>

<div class="container">

    <h1>Վաճառքի հաշվարկ</h1>

    <textarea
        id="salesInput"
        placeholder="Elfbar 20k 6000
Elfbar 50k 20000
3xElfbar 20k 13000"></textarea>

    <div class="main-buttons">
        <button class="calculate-btn" onclick="calculateSales()">
            Հաշվել
        </button>

        <button class="products-btn" onclick="openProducts()">
            Ապրանքներ
        </button>
    </div>

    <div id="result" class="result"></div>

</div>


<!-- ԱՊՐԱՆՔՆԵՐԻ MODAL -->

<div id="productsModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">
            <h2>Ապրանքներ</h2>

            <button class="close-btn" onclick="closeProducts()">
                ×
            </button>
        </div>


        <div class="form-group">
            <label>Ապրանքի անուն</label>

            <input
                type="text"
                id="productName"
                placeholder="Օր․ Elfbar 20k"
            >
        </div>


        <div class="form-group">
            <label>Ինքնարժեք</label>

            <input
                type="number"
                id="productCost"
                placeholder="Օր․ 2000"
            >
        </div>


        <button
            id="saveProductButton"
            class="save-product-btn"
            onclick="saveProduct()"
        >
            Պահպանել
        </button>


        <button
            id="cancelEditButton"
            class="cancel-edit-btn"
            onclick="cancelEdit()"
        >
            Չեղարկել փոփոխությունը
        </button>


        <div id="productList" class="product-list">
            <div class="loading">
                Ապրանքները բեռնվում են...
            </div>
        </div>

    </div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://lklrypbwujwncokdvbpi.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_2rRtfSQmA__E3Z6h8FpyYw_lfNh1S_3";


/*
   Կարևոր է.
   Այստեղ անունը salesSupabase է,
   ոչ թե supabase։
   Դրա շնորհիվ նախկին
   "Identifier 'supabase' has already been declared"
   սխալը չի առաջանա։
*/

const salesSupabase =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =========================================================
   DEFAULT PRODUCTS
========================================================= */

const defaultProducts = [

    { name: "pynepod", cost: 2100 },
    { name: "odens", cost: 500 },
    { name: "elfbar30", cost: 4700 },
    { name: "ignite12", cost: 4000 },
    { name: "waka38", cost: 5800 },
    { name: "pyro", cost: 500 },
    { name: "puffme", cost: 500 },
    { name: "meloso", cost: 2900 },
    { name: "hyppe", cost: 3000 },
    { name: "dojo", cost: 3700 },
    { name: "chilax", cost: 2700 },
    { name: "waka20", cost: 4600 },
    { name: "hqd", cost: 1300 },
    { name: "lostangel", cost: 3200 },
    { name: "ijoy", cost: 3100 },
    { name: "solaris", cost: 2900 },
    { name: "waka2500", cost: 1300 },
    { name: "yooz", cost: 2300 },
    { name: "puffme12", cost: 2400 },
    { name: "toomoro", cost: 3000 },
    { name: "elfbar40", cost: 4800 },
    { name: "elfbar25", cost: 4200 },
    { name: "maxfly", cost: 2600 },
    { name: "ignite25", cost: 7500 },
    { name: "sherbet", cost: 750 },
    { name: "fumari", cost: 900 },
    { name: "acux", cost: 350 },
    { name: "pipich", cost: 600 },
    { name: "udn", cost: 2600 },
    { name: "solobar", cost: 1800 },
    { name: "brusko", cost: 600 },
    { name: "elfbar pod", cost: 2400 },
    { name: "puffme16", cost: 2000 },
    { name: "ignite35", cost: 7900 },
    { name: "yooz qartrij", cost: 1400 },
    { name: "fumo", cost: 700 }

];


/* =========================================================
   VARIABLES
========================================================= */

let products = [];
let editingId = null;


/* =========================================================
   NAME NORMALIZATION
========================================================= */

function normalizeName(name) {

    return String(name)
        .trim()
        .toLowerCase()
        .replace(/\s+/g, " ");

}


/* =========================================================
   MONEY
========================================================= */

function parseMoney(value) {

    return Number(
        String(value).replace(/[^\d]/g, "")
    );

}


/* =========================================================
   LOAD PRODUCTS
========================================================= */

async function loadProducts() {

    const productList =
        document.getElementById("productList");

    productList.innerHTML =
        `<div class="loading">Ապրանքները բեռնվում են...</div>`;


    const { data, error } =
        await salesSupabase
            .from("products")
            .select("*")
            .order("id", { ascending: true });


    if (error) {

        console.error("Supabase load error:", error);

        productList.innerHTML = `
            <div class="error">
                Չհաջողվեց բեռնել ապրանքները։<br><br>
                ${error.message}
            </div>
        `;

        return;
    }


    products = data || [];


    /*
       Եթե աղյուսակը դատարկ է,
       առաջին անգամ ավելացնում ենք
       default ապրանքները։
    */

    if (products.length === 0) {

        await insertDefaultProducts();

        return;
    }


    renderProducts();

}


/* =========================================================
   INSERT DEFAULT PRODUCTS
========================================================= */

async function insertDefaultProducts() {

    const { data, error } =
        await salesSupabase
            .from("products")
            .insert(defaultProducts)
            .select();


    if (error) {

        console.error("Default products error:", error);

        document.getElementById("productList").innerHTML = `
            <div class="error">
                Չհաջողվեց ավելացնել սկզբնական ապրանքները։<br><br>
                ${error.message}
            </div>
        `;

        return;
    }


    products = data || [];

    renderProducts();

}


/* =========================================================
   OPEN PRODUCTS
========================================================= */

function openProducts() {

    document.getElementById("productsModal").style.display = "block";

    renderProducts();

}


/* =========================================================
   CLOSE PRODUCTS
========================================================= */

function closeProducts() {

    document.getElementById("productsModal").style.display = "none";

    cancelEdit();

}


/* =========================================================
   SAVE PRODUCT
========================================================= */

async function saveProduct() {

    const nameInput =
        document.getElementById("productName");

    const costInput =
        document.getElementById("productCost");


    const name =
        nameInput.value.trim();

    const cost =
        Number(costInput.value);


    if (!name) {

        alert("Գրիր ապրանքի անունը");

        return;
    }


    if (!cost || cost <= 0) {

        alert("Գրիր ճիշտ ինքնարժեք");

        return;
    }


    const normalized =
        normalizeName(name);


    /*
       Նոր ապրանքի դեպքում ստուգում ենք,
       որ նույն անունով արդեն չլինի։
    */

    const existingProduct =
        products.find(product => {

            return normalizeName(product.name) === normalized
                && product.id !== editingId;

        });


    if (existingProduct) {

        alert("Այս անունով ապրանքն արդեն գրանցված է։");

        return;
    }


    const saveButton =
        document.getElementById("saveProductButton");

    saveButton.disabled = true;


    let error = null;


    if (editingId === null) {

        const result =
            await salesSupabase
                .from("products")
                .insert({
                    name: name,
                    cost: cost
                })
                .select()
                .single();

        error = result.error;

    } else {

        const result =
            await salesSupabase
                .from("products")
                .update({
                    name: name,
                    cost: cost
                })
                .eq("id", editingId)
                .select()
                .single();

        error = result.error;

    }


    saveButton.disabled = false;


    if (error) {

        console.error("Save product error:", error);

        alert(
            "Չհաջողվեց պահպանել ապրանքը։\n\n" +
            error.message
        );

        return;
    }


    /*
       Մաքրում ենք դաշտերը
    */

    nameInput.value = "";
    costInput.value = "";

    editingId = null;


    document.getElementById("saveProductButton").textContent =
        "Պահպանել";

    document.getElementById("cancelEditButton").style.display =
        "none";


    await loadProducts();

}


/* =========================================================
   EDIT PRODUCT
========================================================= */

function editProduct(id) {

    const product =
        products.find(item => item.id === id);


    if (!product) {
        return;
    }


    document.getElementById("productName").value =
        product.name;


    document.getElementById("productCost").value =
        product.cost;


    editingId = id;


    document.getElementById("saveProductButton").textContent =
        "Պահպանել փոփոխությունը";


    document.getElementById("cancelEditButton").style.display =
        "block";


    document.getElementById("productName").focus();

}


/* =========================================================
   CANCEL EDIT
========================================================= */

function cancelEdit() {

    editingId = null;


    document.getElementById("productName").value = "";
    document.getElementById("productCost").value = "";


    document.getElementById("saveProductButton").textContent =
        "Պահպանել";


    document.getElementById("cancelEditButton").style.display =
        "none";

}


/* =========================================================
   DELETE PRODUCT
========================================================= */

async function deleteProduct(id) {

    const product =
        products.find(item => item.id === id);


    if (!product) {
        return;
    }


    const confirmed =
        confirm(
            `Ջնջե՞լ «${product.name}» ապրանքը։`
        );


    if (!confirmed) {
        return;
    }


    const { error } =
        await salesSupabase
            .from("products")
            .delete()
            .eq("id", id);


    if (error) {

        console.error("Delete error:", error);

        alert(
            "Չհաջողվեց ջնջել ապրանքը։\n\n" +
            error.message
        );

        return;
    }


    if (editingId === id) {
        cancelEdit();
    }


    await loadProducts();

}


/* =========================================================
   RENDER PRODUCTS
========================================================= */

function renderProducts() {

    const container =
        document.getElementById("productList");


    if (!products.length) {

        container.innerHTML =
            `<div class="loading">Ապրանքներ չկան։</div>`;

        return;
    }


    container.innerHTML = "";


    products.forEach(product => {

        const item =
            document.createElement("div");

        item.className = "product-item";


        item.innerHTML = `

            <div class="product-info">

                <div class="product-name">
                    ${escapeHtml(product.name)}
                </div>

                <div class="product-cost">
                    Ինքնարժեք՝ ${formatNumber(product.cost)} ֏
                </div>

            </div>


            <div class="product-actions">

                <button
                    class="edit-btn"
                    onclick="editProduct(${product.id})"
                >
                    Փոխել
                </button>


                <button
                    class="delete-btn"
                    onclick="deleteProduct(${product.id})"
                >
                    Ջնջել
                </button>

            </div>
        `;


        container.appendChild(item);

    });

}


/* =========================================================
   PARSE SALE LINE
========================================================= */

function parseSaleLine(line) {

    const match =
        line.match(/^\s*(.*?)\s+([\d\s.,]+)\s*$/);


    if (!match) {
        return null;
    }


    let productText =
        match[1].trim();


    const salePrice =
        parseMoney(match[2]);


    if (!productText || salePrice <= 0) {
        return null;
    }


    /*
       Օրինակ՝
       3xElfbar 20k 13000

       quantity = 3
       productName = Elfbar 20k
    */

    const quantityMatch =
        productText.match(
            /^\s*(\d+)\s*x\s*(.+)$/i
        );


    if (quantityMatch) {

        return {

            quantity:
                Number(quantityMatch[1]),

            productName:
                quantityMatch[2].trim(),

            salePrice:
                salePrice

        };

    }


    return {

        quantity: 1,

        productName:
            productText,

        salePrice:
            salePrice

    };

}


/* =========================================================
   CALCULATE SALES
========================================================= */

function calculateSales() {

    const input =
        document.getElementById("salesInput").value;


    const result =
        document.getElementById("result");


    result.innerHTML = "";


    const lines =
        input
            .split("\n")
            .map(line => line.trim())
            .filter(line => line);


    if (!lines.length) {

        result.innerHTML = `
            <div class="error">
                Գրիր վաճառքները։
            </div>
        `;

        return;
    }


    let totalSale = 0;
    let totalCost = 0;
    let totalProfit = 0;
    let totalUserHalf = 0;


    let html = "";


    lines.forEach(line => {

        const parsed =
            parseSaleLine(line);


        if (!parsed) {

            html += `
                <div class="error">
                    Այս տողը չհասկացա՝
                    ${escapeHtml(line)}
                </div>
            `;

            return;
        }


        const product =
            products.find(item => {

                return normalizeName(item.name) ===
                    normalizeName(parsed.productName);

            });


        if (!product) {

            html += `
                <div class="error">
                    Ապրանքը գրանցված չէ՝
                    ${escapeHtml(parsed.productName)}
                </div>
            `;

            return;
        }


        const quantity =
            parsed.quantity;


        const sale =
            parsed.salePrice;


        const cost =
            Number(product.cost) * quantity;


        const profit =
            sale - cost;


        const userHalf =
            profit / 2;


        totalSale += sale;
        totalCost += cost;
        totalProfit += profit;
        totalUserHalf += userHalf;


        html += `

            <div class="sale-item">

                <strong>
                    ${quantity} ×
                    ${escapeHtml(product.name)}
                </strong>

                <div>
                    Վաճառք՝
                    ${formatNumber(sale)} ֏
                </div>

                <div>
                    Ինքնարժեք՝
                    ${formatNumber(cost)} ֏
                </div>

                <div>
                    Մաքուր շահույթ՝
                    ${formatNumber(profit)} ֏
                </div>

                <div>
                    Քո կեսը՝
                    ${formatNumber(userHalf)} ֏
                </div>

            </div>
        `;

    });


    html += `

        <div class="totals">

            <div>
                Ընդհանուր վաճառք՝
                <strong>
                    ${formatNumber(totalSale)} ֏
                </strong>
            </div>

            <div>
                Ընդհանուր ինքնարժեք՝
                <strong>
                    ${formatNumber(totalCost)} ֏
                </strong>
            </div>

            <div>
                Ընդհանուր մաքուր շահույթ՝
                <strong>
                    ${formatNumber(totalProfit)} ֏
                </strong>
            </div>

            <div>
                Քո կեսը՝
                <strong>
                    ${formatNumber(totalUserHalf)} ֏
                </strong>
            </div>

        </div>
    `;


    result.innerHTML = html;

}


/* =========================================================
   NUMBER FORMAT
========================================================= */

function formatNumber(number) {

    return Number(number || 0)
        .toLocaleString("en-US");

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   MODAL CLICK OUTSIDE
========================================================= */

window.addEventListener("click", function(event) {

    const modal =
        document.getElementById("productsModal");


    if (event.target === modal) {

        closeProducts();

    }

});


/* =========================================================
   START
========================================================= */

document.addEventListener("DOMContentLoaded", function() {

    loadProducts();

});

</script>

</body>
</html>
