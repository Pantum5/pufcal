<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://lklrypbwujwncokdvbpi.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_2rRtfSQmA__E3Z6h8FpyYw_lfNh1S_3";

const salesSupabase =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =========================================================
   ՀԻՆ ԱՊՐԱՆՔՆԵՐ
========================================================= */

const defaultProducts = [

    { name: "pynepod", cost: 2100 },
    { name: "odens", cost: 500 },
    { name: "elfbar30", cost: 4700 },
    { name: "ignite12", cost: 4000 },

    { name: "ijoy", cost: 3100 },
    { name: "solaris", cost: 2900 },
    { name: "waka2500", cost: 1300 },
    { name: "yooz", cost: 2300 },
    { name: "puffme12", cost: 2400 },
    { name: "toomoro", cost: 3000 },
    { name: "elfbar40", cost: 4800 },
    { name: "elfbar25", cost: 4200 },
    { name: "maxfly", cost: 2600 },
    { name: "ignite25", cost: 7500 },
    { name: "sherbet", cost: 750 },
    { name: "fumari", cost: 900 },
    { name: "acux", cost: 350 },
    { name: "pipich", cost: 600 },
    { name: "udn", cost: 2600 },
    { name: "solobar", cost: 1800 },
    { name: "brusko", cost: 600 },
    { name: "elfbar pod", cost: 2400 },
    { name: "puffme16", cost: 2000 },
    { name: "ignite35", cost: 7900 },
    { name: "yooz qartrij", cost: 1400 },
    { name: "fumo", cost: 700 }

];


/* =========================================================
   VARIABLES
========================================================= */

let products = [];

let editingId = null;


/* =========================================================
   ՕԳՆԱԿԱՆ
========================================================= */

function normalizeName(name) {

    return String(name)
        .trim()
        .toLowerCase()
        .replace(/\s+/g, " ");

}


function parseMoney(value) {

    return Number(
        String(value).replace(/[^\d]/g, "")
    );

}


function formatNumber(number) {

    return Number(number || 0)
        .toLocaleString("en-US");

}


function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   ԲՈԼՈՐ ԱՊՐԱՆՔՆԵՐԻ ԲԵՌՆՈՒՄ
========================================================= */

async function loadProducts() {

    const list =
        document.getElementById("productList");

    list.innerHTML =
        `<div class="loading">Բեռնում...</div>`;


    const { data, error } =
        await salesSupabase
            .from("products")
            .select("*")
            .order("id", { ascending: true });


    if (error) {

        console.error(error);

        list.innerHTML = `
            <div class="error">
                Չհաջողվեց միանալ ապրանքների բազային։<br><br>
                ${escapeHtml(error.message)}
            </div>
        `;

        return;
    }


    products = data || [];


    /*
       Այստեղ ստուգում ենք բոլոր հին ապրանքները։
       Եթե որևէ մեկը բացակայում է՝ ավելացնում ենք։
    */

    const existingNames = new Set(
        products.map(product =>
            normalizeName(product.name)
        )
    );


    const missingProducts =
        defaultProducts.filter(product => {

            return !existingNames.has(
                normalizeName(product.name)
            );

        });


    if (missingProducts.length > 0) {

        const { error: insertError } =
            await salesSupabase
                .from("products")
                .insert(missingProducts);


        if (insertError) {

            console.error(
                "Missing products error:",
                insertError
            );

            list.innerHTML = `
                <div class="error">
                    Չհաջողվեց ավելացնել բացակայող ապրանքները։<br><br>
                    ${escapeHtml(insertError.message)}
                </div>
            `;

            return;
        }


        /*
           Նորից բեռնում ենք,
           որպեսզի նոր ավելացված ապրանքներն էլ լինեն ցուցակում։
        */

        const { data: updatedData, error: reloadError } =
            await salesSupabase
                .from("products")
                .select("*")
                .order("id", { ascending: true });


        if (reloadError) {

            console.error(reloadError);

            list.innerHTML = `
                <div class="error">
                    Չհաջողվեց թարմացնել ապրանքների ցանկը։<br><br>
                    ${escapeHtml(reloadError.message)}
                </div>
            `;

            return;
        }


        products = updatedData || [];

    }


    renderProducts();

}


/* =========================================================
   ԱՊՐԱՆՔՆԵՐԻ MODAL
========================================================= */

function openProducts() {

    document.getElementById("productsModal").style.display =
        "block";

    renderProducts();

}


function closeProducts() {

    document.getElementById("productsModal").style.display =
        "none";

    cancelEdit();

}


/* =========================================================
   ԱՊՐԱՆՔԻ ՊԱՀՊԱՆՈՒՄ
========================================================= */

async function saveProduct() {

    const nameInput =
        document.getElementById("productName");

    const costInput =
        document.getElementById("productCost");

    const name =
        nameInput.value.trim();

    const cost =
        Number(costInput.value);


    if (!name) {

        alert("Գրիր ապրանքի անունը");

        return;

    }


    if (!cost || cost <= 0) {

        alert("Գրիր ճիշտ ինքնարժեք");

        return;

    }


    const normalized =
        normalizeName(name);


    /*
       Չենք թողնում նույն անունով կրկնվող ապրանք։
    */

    const duplicate =
        products.find(product => {

            return normalizeName(product.name) === normalized
                && product.id !== editingId;

        });


    if (duplicate) {

        alert("Այս ապրանքն արդեն գրանցված է։");

        return;

    }


    const button =
        document.getElementById("saveProductButton");

    button.disabled = true;


    let error = null;


    if (editingId === null) {

        const response =
            await salesSupabase
                .from("products")
                .insert({
                    name: name,
                    cost: cost
                });


        error = response.error;

    } else {

        const response =
            await salesSupabase
                .from("products")
                .update({
                    name: name,
                    cost: cost
                })
                .eq("id", editingId);


        error = response.error;

    }


    button.disabled = false;


    if (error) {

        console.error(error);

        alert(
            "Չհաջողվեց պահպանել։\n\n" +
            error.message
        );

        return;

    }


    cancelEdit();

    await loadProducts();

}


/* =========================================================
   ՓՈՓՈԽԵԼ
========================================================= */

function editProduct(id) {

    const product =
        products.find(item => item.id === id);


    if (!product) {
        return;
    }


    document.getElementById("productName").value =
        product.name;


    document.getElementById("productCost").value =
        product.cost;


    editingId = id;


    document.getElementById("saveProductButton").textContent =
        "Պահպանել փոփոխությունը";


    document.getElementById("cancelEditButton").style.display =
        "block";


    document.getElementById("productName").focus();

}


/* =========================================================
   ՉԵՂԱՐԿԵԼ
========================================================= */

function cancelEdit() {

    editingId = null;


    document.getElementById("productName").value = "";

    document.getElementById("productCost").value = "";


    document.getElementById("saveProductButton").textContent =
        "Պահպանել";


    document.getElementById("cancelEditButton").style.display =
        "none";

}


/* =========================================================
   ՋՆՋԵԼ
========================================================= */

async function deleteProduct(id) {

    const product =
        products.find(item => item.id === id);


    if (!product) {
        return;
    }


    if (
        !confirm(
            `Ջնջե՞լ «${product.name}» ապրանքը։`
        )
    ) {

        return;

    }


    const { error } =
        await salesSupabase
            .from("products")
            .delete()
            .eq("id", id);


    if (error) {

        console.error(error);

        alert(
            "Չհաջողվեց ջնջել ապրանքը։\n\n" +
            error.message
        );

        return;

    }


    if (editingId === id) {

        cancelEdit();

    }


    await loadProducts();

}


/* =========================================================
   ՑՈՒՑԱԿ
========================================================= */

function renderProducts() {

    const list =
        document.getElementById("productList");


    if (!products.length) {

        list.innerHTML =
            `<div class="loading">Ապրանքներ չկան։</div>`;

        return;

    }


    list.innerHTML = "";


    products.forEach(product => {

        const item =
            document.createElement("div");

        item.className = "product-item";


        item.innerHTML = `

            <div class="product-info">

                <div class="product-name">
                    ${escapeHtml(product.name)}
                </div>

                <div class="product-cost">
                    Ինքնարժեք՝
                    ${formatNumber(product.cost)} ֏
                </div>

            </div>


            <div class="product-actions">

                <button
                    class="edit-btn"
                    onclick="editProduct(${product.id})"
                >
                    Փոխել
                </button>

                <button
                    class="delete-btn"
                    onclick="deleteProduct(${product.id})"
                >
                    Ջնջել
                </button>

            </div>

        `;


        list.appendChild(item);

    });

}


/* =========================================================
   ՎԱՃԱՌՔԻ ՏՈՂԻ ՎԵՐԼՈՒԾՈՒՄ
========================================================= */

function parseSaleLine(line) {

    const match =
        line.match(/^\s*(.*?)\s+([\d\s.,]+)\s*$/);


    if (!match) {

        return null;

    }


    const productText =
        match[1].trim();


    const salePrice =
        parseMoney(match[2]);


    if (!productText || salePrice <= 0) {

        return null;

    }


    /*
       3xElfbar 20k 13000
    */

    const quantityMatch =
        productText.match(
            /^\s*(\d+)\s*x\s*(.+)$/i
        );


    if (quantityMatch) {

        return {

            quantity:
                Number(quantityMatch[1]),

            productName:
                quantityMatch[2].trim(),

            salePrice:
                salePrice

        };

    }


    return {

        quantity: 1,

        productName:
            productText,

        salePrice:
            salePrice

    };

}


/* =========================================================
   ՀԱՇՎԱՐԿ
========================================================= */

function calculateSales() {

    const input =
        document.getElementById("salesInput").value;


    const result =
        document.getElementById("result");


    result.innerHTML = "";


    const lines =
        input
            .split("\n")
            .map(line => line.trim())
            .filter(line => line);


    if (!lines.length) {

        result.innerHTML = `
            <div class="error">
                Գրիր վաճառքները։
            </div>
        `;

        return;

    }


    let totalSale = 0;

    let totalCost = 0;

    let totalProfit = 0;

    let totalUserHalf = 0;


    let html = "";


    lines.forEach(line => {

        const parsed =
            parseSaleLine(line);


        if (!parsed) {

            html += `
                <div class="error">
                    Այս տողը չհասկացա՝
                    ${escapeHtml(line)}
                </div>
            `;

            return;

        }


        const product =
            products.find(item => {

                return normalizeName(item.name) ===
                    normalizeName(parsed.productName);

            });


        if (!product) {

            html += `
                <div class="error">
                    Ապրանքը գրանցված չէ՝
                    ${escapeHtml(parsed.productName)}
                </div>
            `;

            return;

        }


        const quantity =
            parsed.quantity;


        const sale =
            parsed.salePrice;


        const cost =
            Number(product.cost) * quantity;


        const profit =
            sale - cost;


        const userHalf =
            profit / 2;


        totalSale += sale;

        totalCost += cost;

        totalProfit += profit;

        totalUserHalf += userHalf;


        html += `

            <div class="sale-item">

                <strong>
                    ${quantity} ×
                    ${escapeHtml(product.name)}
                </strong>

                <div>
                    Վաճառք՝
                    ${formatNumber(sale)} ֏
                </div>

                <div>
                    Ինքնարժեք՝
                    ${formatNumber(cost)} ֏
                </div>

                <div>
                    Մաքուր շահույթ՝
                    ${formatNumber(profit)} ֏
                </div>

                <div>
                    Քո կեսը՝
                    ${formatNumber(userHalf)} ֏
                </div>

            </div>

        `;

    });


    html += `

        <div class="totals">

            <div>
                Ընդհանուր վաճառք՝
                <strong>
                    ${formatNumber(totalSale)} ֏
                </strong>
            </div>

            <div>
                Ընդհանուր ինքնարժեք՝
                <strong>
                    ${formatNumber(totalCost)} ֏
                </strong>
            </div>

            <div>
                Ընդհանուր մաքուր շահույթ՝
                <strong>
                    ${formatNumber(totalProfit)} ֏
                </strong>
            </div>

            <div>
                Քո կեսը՝
                <strong>
                    ${formatNumber(totalUserHalf)} ֏
                </strong>
            </div>

        </div>

    `;


    result.innerHTML = html;

}


/* =========================================================
   MODAL-ԻՑ ԴՈՒՐՍ ՍԵՂՄԵԼ
========================================================= */

window.addEventListener("click", function(event) {

    const modal =
        document.getElementById("productsModal");


    if (event.target === modal) {

        closeProducts();

    }

});


/* =========================================================
   ՍԿԻԶԲ
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadProducts();

    }
);

</script>
